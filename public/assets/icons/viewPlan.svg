<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="shockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Energy Glow -->
  <circle cx="100" cy="100" r="80" fill="url(#shockGlow)" />

  <!-- Shockwave / Ripple Arcs -->
  <path d="M 55 55 Q 100 20 145 55" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 35 100 Q 100 50 165 100" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 55 145 Q 100 180 145 145" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Central Electric Lightning Bolt -->
  <polygon points="115,15 60,110 102,110 82,185 150,88 108,88" fill="#f59e0b" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" />
</svg>
